services:
  - type: web
    name: hostelhub-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/hostelhub.db
      - key: CORS_ORIGIN
        sync: false
    disk:
      name: hostelhub-data
      mountPath: /var/data
      sizeGB: 1
